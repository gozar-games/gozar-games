<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>GOZAR GAMES | Crossy Road</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#080808;--panel:#151515;--line:#303030;--accent:#ed1725;--muted:#aaa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f5f5;font-family:Vazirmatn,sans-serif;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;overflow:hidden;touch-action:pan-x pan-y}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:100%;max-width:none;height:100vh;height:100dvh;margin:0;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
.top{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between}
.back{border:1px solid #383838;background:#191919;border-radius:11px;padding:8px 12px;font-size:12px}
.brand{font-weight:900;letter-spacing:.4px}.brand span{color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:6px 12px;text-align:center}
.stat strong{display:block;font-size:22px;line-height:1.3;color:#fff;direction:ltr}
.stat small{font-size:10px;color:var(--muted)}
.stage{position:relative;flex:1;min-height:220px;width:calc(100% + 24px);margin-inline:-12px;overflow:hidden;border:0;border-radius:0;background:linear-gradient(#8bd5ff,#d2efff 55%,#b6e1a1);box-shadow:0 8px 28px #0006;touch-action:none}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#05090dcc;backdrop-filter:blur(5px);text-align:center}
.overlay.hidden{display:none}
.dialog{width:min(100%,300px);background:#151515ed;border:1px solid #454545;border-radius:19px;padding:20px 17px;box-shadow:0 15px 45px #0008}
.dialog .emoji{font-size:42px}
.dialog h1{font-size:23px;margin:5px 0 4px}
.dialog p{font-size:12px;color:#bbb;line-height:1.9;margin:5px 0 15px}
.skin-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 15px}
.skin-option{min-width:0;border:1px solid #454545;border-radius:13px;background:#202020;padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,background .15s,transform .15s}
.skin-option .skin-icon{font-size:29px;line-height:1.25}
.skin-option strong{font-size:11px}
.skin-option small{font-size:9px;color:#aaa}
.skin-option.active{border:2px solid #ed1725;background:#35191d;box-shadow:0 0 0 2px #ed172533}
.skin-option:active{transform:scale(.97)}
.primary{border:0;border-radius:12px;background:var(--accent);padding:11px 22px;font-weight:900;min-width:145px}
.secondary{border:1px solid #444;border-radius:12px;background:#242424;padding:10px 16px;font-weight:800;margin-right:6px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:none;direction:ltr}
.control{height:51px;border:1px solid #383838;border-radius:14px;background:#191919;font-size:21px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}
.control.forward{background:#292020;border-color:#713038;color:#ff7078}
.control:active{transform:scale(.96);background:#333}
.hint{flex:none;text-align:center;color:#999;font-size:10px;line-height:1.7}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#151515dd;border:1px solid #555;border-radius:20px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media(min-height:760px){.app{gap:11px}.control{height:56px}.hint{font-size:11px}}
@media(max-height:620px){.app{gap:6px;padding-top:5px;padding-bottom:5px}.top{height:34px}.stat{padding:3px 9px}.stat strong{font-size:18px}.control{height:43px}.hint{font-size:9px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backButton">← بازگشت</button>
    <div class="brand">GOZAR <span>GAMES</span></div>
  </header>

  <section class="stats">
    <div class="stat"><strong id="score">0</strong><small>امتیاز</small></div>
    <div class="stat"><strong id="best">0</strong><small>رکورد</small></div>
  </section>

  <main class="stage" id="stage">
    <canvas id="game" aria-label="بازی سه بعدی Crossy Road"></canvas>
    <div class="toast" id="toast"></div>
    <section class="overlay" id="startOverlay">
      <div class="dialog">
        <div class="emoji">🐤</div>
        <h1>Crossy Road</h1>
        <p>شخصیت مورد علاقه‌ات را انتخاب کن و وارد بازی شو.<br>از جاده‌ها، رودخانه‌ها و ریل قطار عبور کن!</p>
        <div class="skin-picker" role="group" aria-label="انتخاب شخصیت">
          <button class="skin-option" id="chickenSkin" type="button" aria-pressed="false">
            <span class="skin-icon">🐔</span><strong>مرغ سفید</strong><small>شخصیت کلاسیک</small>
          </button>
          <button class="skin-option" id="suitSkin" type="button" aria-pressed="false">
            <span class="skin-icon">🕴️</span><strong>مرد کت‌وشلواری</strong><small>استایل رسمی</small>
          </button>
        </div>
        <button class="primary" id="startButton">شروع بازی</button>
      </div>
    </section>
    <section class="overlay hidden" id="gameOverOverlay">
      <div class="dialog">
        <div class="emoji">💥</div>
        <h1>GAME OVER</h1>
        <p id="finalText">امتیاز: 0</p>
        <button class="primary" id="retryButton">بازی دوباره</button>
        <button class="secondary" id="homeButton">بازگشت</button>
      </div>
    </section>
  </main>

  <section class="controls" aria-label="کنترل بازی">
    <button class="control" id="leftButton" aria-label="چپ">◀</button>
    <button class="control forward" id="forwardButton" aria-label="جلو">▲</button>
    <button class="control" id="rightButton" aria-label="راست">▶</button>
  </section>
  <div class="hint">برای حرکت به جلو روی ▲ بزن؛ برای چپ و راست از دکمه‌ها یا کشیدن انگشت استفاده کن.</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('game');
const stage = document.getElementById('stage');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalText = document.getElementById('finalText');
const toastEl = document.getElementById('toast');

const BEST_KEY = 'gozar_crossy_best_v1';
let best = Number(localStorage.getItem(BEST_KEY) || 0);
if (!Number.isFinite(best) || best < 0) best = 0;
bestEl.textContent = String(best);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bdcff);
scene.fog = new THREE.Fog(0x9bdcff, 22, 48);
// skyGlow sphere removed: its opaque inner surface blocked the map as the camera moved forward.

const camera = new THREE.PerspectiveCamera(43, 1, 0.1, 220);
camera.position.set(0, 13, 11.5);
// Shared look target used by resetGame() and the smooth camera follow.
const cameraLookTarget = new THREE.Vector3(0, 0, -3.5);
camera.lookAt(cameraLookTarget);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch (err) {
  startOverlay.classList.remove('hidden');
  startOverlay.querySelector('p').textContent = 'مرورگر دستگاه از WebGL پشتیبانی نمی‌کند. لطفاً مرورگر دیگری را امتحان کن.';
  document.getElementById('startButton').disabled = true;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.85));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

scene.add(new THREE.HemisphereLight(0xffffff, 0x68805b, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(-5, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00018;
sun.shadow.normalBias = 0.025;
sun.shadow.radius = 4;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
scene.add(sun);

const materials = {
  grass: new THREE.MeshStandardMaterial({color:0x64b94f, roughness:1}),
  grassAlt: new THREE.MeshStandardMaterial({color:0x70c75a, roughness:1}),
  road: new THREE.MeshStandardMaterial({color:0x42464c, roughness:1}),
  roadLine: new THREE.MeshStandardMaterial({color:0xf4e7a4, roughness:1}),
  water: new THREE.MeshStandardMaterial({color:0x2798cf, roughness:.35, metalness:.05}),
  rail: new THREE.MeshStandardMaterial({color:0x777d85, metalness:.65, roughness:.35}),
  sleeper: new THREE.MeshStandardMaterial({color:0x79563d, roughness:1}),
  log: new THREE.MeshStandardMaterial({color:0x95602f, roughness:1}),
  leaf: new THREE.MeshStandardMaterial({color:0x268b43, roughness:1}),
  trunk: new THREE.MeshStandardMaterial({color:0x80502b, roughness:1}),
  white: new THREE.MeshStandardMaterial({color:0xffffff, roughness:.8}),
  dark: new THREE.MeshStandardMaterial({color:0x25282c, roughness:.8})
};

// Map progression: the first four environments unlock at fixed scores.
// After 380 points, a new random environment is selected every 80 points.
const MAP_THEMES = ['main','red','desert','winter'];
const MAP_NAMES = {main:'جنگل سبز',red:'شهر سرخ',desert:'بیابان و ریل قطار',winter:'زمستان برفی'};
const randomMapSegments = new Map();
let currentMapTheme = 'main';
function mapThemeForScore(value) {
  if(value < 80) return 'main';
  if(value < 150) return 'red';
  if(value < 230) return 'desert';
  if(value < 380) return 'winter';
  const segment = Math.floor((value - 380) / 80);
  if(!randomMapSegments.has(segment)) {
    const previous = segment === 0 ? 'winter' : randomMapSegments.get(segment - 1);
    const choices = MAP_THEMES.filter(name => name !== previous);
    randomMapSegments.set(segment, randomItem(choices));
  }
  return randomMapSegments.get(segment);
}
function applyMapTheme(theme, announce=false) {
  if(!theme) return;
  const changed = currentMapTheme !== theme;
  currentMapTheme = theme;
  const palettes = {
    main:{grass:0x64b94f,grassAlt:0x70c75a,road:0x42464c,line:0xf4e7a4,water:0x2798cf,rail:0x777d85,sleeper:0x79563d,log:0x95602f,sky:0x9bdcff,fog:0x9bdcff},
    red:{grass:0xf07855,grassAlt:0xff8a60,road:0x824d50,line:0xffc3a5,water:0x39b9b0,rail:0x9a7770,sleeper:0x8d4036,log:0x9b4d38,sky:0xff987f,fog:0xff987f},
    desert:{grass:0xe8ad62,grassAlt:0xf4c078,road:0x454b59,line:0xf1d7a1,water:0x3b9fc4,rail:0x777d85,sleeper:0x76513c,log:0x98643a,sky:0xf3c27c,fog:0xf3c27c},
    winter:{grass:0xb9d8ee,grassAlt:0xd9efff,road:0x657b9d,line:0xeaf8ff,water:0x9fe8f5,rail:0x9baec8,sleeper:0x8b8fa7,log:0xc4d9e8,sky:0x9fc9f4,fog:0xb9d7f5}
  }[theme];
  for(const key of ['grass','grassAlt','road','water','rail','sleeper','log']) {
    if(materials[key]) materials[key].color.setHex(palettes[key]);
  }
  materials.roadLine.color.setHex(palettes.line);
  materials.grass.map = theme === 'main' ? grassSurfaceTexture : null;
  materials.grassAlt.map = materials.grass.map;
  materials.grass.needsUpdate = true;
  materials.grassAlt.needsUpdate = true;
  scene.background = new THREE.Color(palettes.sky);
  scene.fog.color.setHex(palettes.fog);
  if(changed && announce) showToast('🗺️ مپ جدید: ' + MAP_NAMES[theme]);
}

// Procedural, lightweight surface maps: detailed without downloading image assets.
function makeSurfaceTexture(kind, base, count=900) {
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle=base; ctx.fillRect(0,0,256,256);
  if(kind==='grass') {
    for(let i=0;i<count;i++) {
      const x=Math.random()*256,y=Math.random()*256;
      ctx.strokeStyle=Math.random()>.5?'rgba(28,83,34,.22)':'rgba(225,244,177,.24)';
      ctx.lineWidth=.7+Math.random()*1.1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+1+Math.random()*4,y-2-Math.random()*5); ctx.stroke();
    }
    for(let i=0;i<55;i++){ctx.fillStyle='rgba(255,255,255,.10)';ctx.beginPath();ctx.arc(Math.random()*256,Math.random()*256,1+Math.random()*2,0,Math.PI*2);ctx.fill();}
  } else if(kind==='road') {
    for(let i=0;i<count*1.5;i++){const v=Math.random()>.5?255:0;ctx.fillStyle=`rgba(${v},${v},${v},${Math.random()*.12})`;ctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*2);}
    for(let i=0;i<22;i++){ctx.strokeStyle='rgba(20,20,20,.12)';ctx.lineWidth=1;ctx.beginPath();let x=Math.random()*256,y=Math.random()*256;ctx.moveTo(x,y);ctx.lineTo(x+8+Math.random()*18,y+Math.random()*3);ctx.stroke();}
  } else if(kind==='water') {
    for(let y=0;y<256;y+=8){ctx.strokeStyle=`rgba(220,245,255,${.06+Math.random()*.13})`;ctx.lineWidth=1+Math.random()*2;ctx.beginPath();for(let x=0;x<=256;x+=8){const yy=y+Math.sin((x+y)*.045)*2.5; if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();}
    for(let i=0;i<75;i++){ctx.fillStyle='rgba(225,250,255,.12)';ctx.beginPath();ctx.ellipse(Math.random()*256,Math.random()*256,2+Math.random()*7,.7+Math.random()*1.5,0,0,Math.PI*2);ctx.fill();}
  } else if(kind==='bark') {
    for(let i=0;i<150;i++){ctx.strokeStyle=Math.random()>.5?'rgba(48,25,10,.18)':'rgba(235,190,125,.16)';ctx.lineWidth=.5+Math.random()*2;ctx.beginPath();let x=Math.random()*256;ctx.moveTo(x,0);ctx.bezierCurveTo(x-5,70,x+5,170,x,256);ctx.stroke();}
  }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return tex;
}
const grassSurfaceTexture=makeSurfaceTexture('grass','#70ad50',1150);
grassSurfaceTexture.repeat.set(3,1);
materials.grass.map=grassSurfaceTexture;
materials.grassAlt.map=grassSurfaceTexture;
materials.road.map=makeSurfaceTexture('road','#62666a',1450); materials.road.map.repeat.set(4,1);
materials.water.map=makeSurfaceTexture('water','#3a9fc8',400); materials.water.map.repeat.set(3,1);
materials.log.map=makeSurfaceTexture('bark','#98643a',150); materials.log.map.repeat.set(1.5,1);
materials.grass.needsUpdate=true; materials.road.needsUpdate=true; materials.water.needsUpdate=true; materials.log.needsUpdate=true;

function roundedBox(parent,x,y,z,sx,sy,sz,material,radius=.1,segments=3) {
  const r=Math.min(radius,sx*.18,sy*.22,sz*.18), shape=new THREE.Shape();
  shape.moveTo(-sx/2+r,-sy/2); shape.lineTo(sx/2-r,-sy/2); shape.quadraticCurveTo(sx/2,-sy/2,sx/2,-sy/2+r);
  shape.lineTo(sx/2,sy/2-r); shape.quadraticCurveTo(sx/2,sy/2,sx/2-r,sy/2);
  shape.lineTo(-sx/2+r,sy/2); shape.quadraticCurveTo(-sx/2,sy/2,-sx/2,sy/2-r);
  shape.lineTo(-sx/2,-sy/2+r); shape.quadraticCurveTo(-sx/2,-sy/2,-sx/2+r,-sy/2);
  const geometry=new THREE.ExtrudeGeometry(shape,{depth:sz,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:r*.35,bevelThickness:r*.35,curveSegments:segments});
  geometry.translate(0,0,-sz/2);
  const mesh=new THREE.Mesh(geometry,material); mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}

const unitBox = new THREE.BoxGeometry(1,1,1);
const unitCylinder = new THREE.CylinderGeometry(.5,.5,1,8);
const world = new THREE.Group();
scene.add(world);

function box(parent, x,y,z, sx,sy,sz, material, cast=true, receive=true) {
  const mesh = new THREE.Mesh(unitBox, material);
  mesh.position.set(x,y,z);
  mesh.scale.set(sx,sy,sz);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}
function makeMaterial(color, roughness=0.8) {
  return new THREE.MeshStandardMaterial({color, roughness});
}
function randomItem(items){ return items[Math.floor(Math.random()*items.length)]; }

const player = new THREE.Group();
world.add(player);
const playerBody = new THREE.Group();
player.add(playerBody);
const bodyMat = makeMaterial(0xffc94f,.88);
const bellyMat = makeMaterial(0xfff0ce,.92);
const beakMat = makeMaterial(0xf18a27,.72);
const eyeMat = makeMaterial(0x171717, .22);
const SKIN_KEY = 'gozar_crossy_skin_v1';
let selectedSkin = localStorage.getItem(SKIN_KEY) === 'suit' ? 'suit' : 'chicken';

function addVoxel(parent,x,y,z,sx,sy,sz,color,materialOptions={}) {
  const mat = color?.isMaterial ? color : makeMaterial(color, materialOptions.roughness ?? .85);
  return box(parent,x,y,z,sx,sy,sz,mat,true,true);
}
function buildChickenSkin() {
  // Classic voxel chicken: white body, square head, red comb, orange beak and feet.
  const white = makeMaterial(0xf5f3e9,.92), cream = makeMaterial(0xfff8e8,.95);
  const red = makeMaterial(0xd9272e,.8), orange = makeMaterial(0xf28a19,.78);
  const black = makeMaterial(0x171717,.35);
  addVoxel(playerBody,0,.55,0,.62,.68,.58,white);
  addVoxel(playerBody,0,1.02,-.015,.57,.48,.55,cream);
  addVoxel(playerBody,0,1.31,-.015,.16,.18,.18,red);
  addVoxel(playerBody,-.12,1.27,-.015,.13,.13,.16,red);
  addVoxel(playerBody,.12,1.27,-.015,.13,.13,.16,red);
  addVoxel(playerBody,0,.99,-.34,.25,.15,.22,orange);
  for(const x of [-.17,.17]) {
    addVoxel(playerBody,x,1.09,-.292,.075,.085,.035,black);
    addVoxel(playerBody,x,.16,.015,.15,.22,.17,orange);
    addVoxel(playerBody,x,.055,-.105,.25,.10,.30,orange);
  }
}
function buildSuitSkin() {
  // Block-built businessman inspired by the supplied reference image.
  const suit = makeMaterial(0x10151b,.82), suitSide = makeMaterial(0x202832,.86);
  const shirt = makeMaterial(0xf2eee4,.9), skin = makeMaterial(0xe8b987,.9);
  const hair = makeMaterial(0x211b1a,.9), beard = makeMaterial(0x392722,.95);
  const shades = makeMaterial(0x080b10,.22), lens = makeMaterial(0x151c25,.16);
  const tie = makeMaterial(0x8b2027,.75), shoe = makeMaterial(0x080a0d,.8);
  const cigarette = makeMaterial(0xf4eee2,.65), ember = makeMaterial(0xf05b24,.6);
  // Legs, shoes and tailored torso.
  addVoxel(playerBody,-.18,.25,0,.25,.55,.30,suit);
  addVoxel(playerBody,.18,.25,0,.25,.55,.30,suit);
  addVoxel(playerBody,-.18,.055,-.045,.34,.16,.43,shoe);
  addVoxel(playerBody,.18,.055,-.045,.34,.16,.43,shoe);
  addVoxel(playerBody,0,.76,0,.72,.66,.43,suit);
  // White shirt panel and tie on the front (negative Z).
  addVoxel(playerBody,0,.83,-.226,.29,.53,.035,shirt);
  addVoxel(playerBody,0,.93,-.251,.105,.18,.045,tie);
  addVoxel(playerBody,0,.69,-.253,.14,.25,.05,tie);
  // Neck and oversized square head.
  addVoxel(playerBody,0,1.16,-.005,.23,.20,.24,skin);
  addVoxel(playerBody,0,1.53,-.005,.66,.65,.55,skin);
  // Dark swept hair cap and side blocks.
  addVoxel(playerBody,0,1.87,-.005,.69,.19,.59,hair);
  addVoxel(playerBody,-.30,1.70,-.005,.12,.28,.56,hair);
  addVoxel(playerBody,.30,1.70,-.005,.12,.28,.56,hair);
  // Ears.
  addVoxel(playerBody,-.385,1.52,-.005,.12,.19,.18,skin);
  addVoxel(playerBody,.385,1.52,-.005,.12,.19,.18,skin);
  // Sunglasses: broad black band, two dark lenses and bridge.
  addVoxel(playerBody,0,1.60,-.291,.66,.19,.055,shades);
  addVoxel(playerBody,-.16,1.60,-.326,.23,.145,.025,lens);
  addVoxel(playerBody,.16,1.60,-.326,.23,.145,.025,lens);
  addVoxel(playerBody,0,1.60,-.345,.09,.045,.025,shades);
  // Beard and moustache framing the lower face.
  addVoxel(playerBody,0,1.27,-.294,.48,.19,.09,beard);
  addVoxel(playerBody,-.12,1.39,-.302,.22,.085,.07,beard);
  addVoxel(playerBody,.12,1.39,-.302,.22,.085,.07,beard);
  addVoxel(playerBody,0,1.34,-.355,.14,.07,.035,skin);
  // Arms and hands. One arm extends forward to hold the cigarette.
  addVoxel(playerBody,-.47,.78,-.015,.22,.58,.25,suit);
  addVoxel(playerBody,-.47,.45,-.06,.20,.18,.22,skin);
  addVoxel(playerBody,.47,.78,-.015,.22,.58,.25,suit);
  addVoxel(playerBody,.47,.48,-.19,.20,.18,.20,skin);
  addVoxel(playerBody,.47,.49,-.36,.13,.12,.12,skin);
  // Small stylized cigarette with orange tip, held in front of the face.
  addVoxel(playerBody,.47,.53,-.56,.10,.10,.43,cigarette);
  addVoxel(playerBody,.47,.53,-.785,.105,.105,.09,ember);
}
function applySkin(skinName, persist=true) {
  selectedSkin = skinName === 'suit' ? 'suit' : 'chicken';
  playerBody.clear();
  if(selectedSkin === 'suit') buildSuitSkin();

applySkin(selectedSkin,false);
player.position.set(0,0,0);

const rows = new Map();
const moving = [];
const decorations = [];
let running = false;
let ended = false;
let score = 0;
let maxForward = 0;
let playerX = 0;
let playerRow = 0;
let jump = null;
let lastTime = 0;
let animationId = 0;
let toastTimer = 0;
let trainWarning = null;
const LANE_WIDTH = 1.35;
const ROAD_WIDTH = 18;
const VISIBLE_BACK = 8;
const VISIBLE_FRONT = 20;

function laneGroup(z, type, index) {
  const group = new THREE.Group();
  group.position.z = z;
  world.add(group);
  // Continuous grassy shoulders keep the world from looking like a narrow floating strip.
  box(group,0,-.23,0,38,.16,1.35,materials.grass,false,true);
  const data = {group, type, index, theme:mapThemeForScore(index), objects:[], obstacles:[], speed:0, direction:1, safe:false, train:null, warning:null};
  rows.set(index, data);
  if (type === 'grass') buildGrass(data);
  if (type === 'road') buildRoad(data);
  if (type === 'river') buildRiver(data);
  if (type === 'rail') buildRail(data);
  // Distinctive scenery beside the playable lanes for each map.
  if(data.theme === 'red' && type !== 'road') {
    const stone=makeMaterial(0xb93632), trim=makeMaterial(0xf06b55);
    for(const side of [-1,1]) {
      const tower=new THREE.Group(); tower.position.set(side*7.1,0,z*0);
      box(tower,0,.72,0,.72,1.44,.72,stone,true,true);
      box(tower,0,1.5,0,1.02,.18,1.02,trim,true,true);
      box(tower,0,1.66,0,.62,.16,.62,stone,true,true);
      group.add(tower);
    }
  } else if(data.theme === 'desert' && type === 'grass') {
    const cactus=makeMaterial(0x397d49);
    for(const side of [-1,1]) {
      const x=side*6.8;
      box(group,x,.72,0,.38,1.44,.38,cactus,true,true);
      box(group,x-side*.28,.78,0,.22,.62,.24,cactus,true,true);
      box(group,x+side*.28,1.0,0,.22,.72,.24,cactus,true,true);
    }
  } else if(data.theme === 'winter' && type === 'grass') {
    const snow=makeMaterial(0xf3f9ff), ice=makeMaterial(0x9ed5f2);
    for(const side of [-1,1]) {
      const x=side*6.8;
      const pine=new THREE.Mesh(new THREE.ConeGeometry(.75,1.8,4),snow);
      pine.position.set(x,.9,0); pine.rotation.y=Math.PI/4; pine.castShadow=true; group.add(pine);
      box(group,x,.12,.42,.72,.22,.72,ice,true,true);
    }
  }
  return data;
}
function buildGrass(row) {
  box(row.group,0,-.12,0,ROAD_WIDTH,.24,1.35,materials.grass);
  // Grid-based trees: the center lane is ALWAYS open, so there is always
  // a guaranteed route forward. Trees never occupy arbitrary half-lanes.
  const candidates = [-2,-1,1,2];
  const shuffled = [...candidates].sort(() => Math.random() - .5);
  const wanted = Math.random() < .25 ? 0 : (Math.random() < .68 ? 1 : 2);
  const chosen = [];
  for (const lane of shuffled) {
    if (chosen.length >= wanted) break;
    // Keep at least one clear neighboring lane; don't form a solid wall.
    if (chosen.some(other => Math.abs(other - lane) === 1)) continue;
    chosen.push(lane);
  }
  for (const lane of chosen) {
    const x = lane * LANE_WIDTH;
    const tree = new THREE.Group();
    tree.position.set(x,0,0);
    row.group.add(tree);
    // Environment-specific voxel obstacles keep each unlocked map visually distinct.
    if(row.theme === 'desert') {
      const cactusMat = makeMaterial(0x397d49);
      box(tree,0,.66,0,.34,1.32,.34,cactusMat,true,true);
      box(tree,-.28,.72,0,.24,.62,.28,cactusMat,true,true);
      box(tree,-.17,1.02,0,.22,.22,.28,cactusMat,true,true);
      box(tree,.28,.88,0,.24,.72,.28,cactusMat,true,true);
      box(tree,.17,1.18,0,.22,.22,.28,cactusMat,true,true);
    } else if(row.theme === 'winter') {
      const trunkMat = makeMaterial(0x8793a5);
      const snowMat = makeMaterial(0xf1f8ff);
      box(tree,0,.28,0,.28,.56,.28,trunkMat,true,true);
      for(let layer=0;layer<3;layer++) {
        const size=1.0-layer*.22, y=.55+layer*.38;
        const cone=new THREE.Mesh(new THREE.ConeGeometry(size*.62,.78,4),snowMat);
        cone.position.set(0,y,0); cone.rotation.y=Math.PI/4; cone.castShadow=true; tree.add(cone);
      }
    } else if(row.theme === 'red') {
      const redStone = makeMaterial(0xb93632);
      const coral = makeMaterial(0xf06450);
      box(tree,0,.52,0,.82,1.04,.82,redStone,true,true);
      box(tree,0,1.12,0,1.02,.18,1.02,coral,true,true);
      box(tree,0,1.27,0,.72,.16,.72,redStone,true,true);
    } else {
      const trunkMat = makeMaterial(0x68412b);
      box(tree,0,.30,0,.34,.62,.34,trunkMat,true,true);
      const greens = [0x91c91d,0x9fd923,0x83b817];
      const widths = [1.02,1.00,.96];
      const heights = [.48,.48,.46];
      let canopyY = .68;
      for(let layer=0; layer<3; layer++) {
        const foliage = new THREE.MeshStandardMaterial({color:greens[layer],roughness:1,flatShading:true});
        const block = new THREE.Mesh(new THREE.BoxGeometry(widths[layer],heights[layer],.86),foliage);
        block.position.set(0,canopyY+heights[layer]/2,0);
        block.castShadow=true; block.receiveShadow=true; tree.add(block);
        canopyY += heights[layer]-.035;
      }
    }
    decorations.push(tree);
    row.obstacles.push({x, lane});
  }
}

function buildRoad(row) {
  box(row.group,0,-.12,0,ROAD_WIDTH,.24,1.35,materials.road);
  box(row.group,0,.015,-.64,ROAD_WIDTH,.035,.055,makeMaterial(0xd2c7a0),false,false);
  box(row.group,0,.015,.64,ROAD_WIDTH,.035,.055,makeMaterial(0xd2c7a0),false,false);
  for(let x=-8;x<=8;x+=2){
    box(row.group,x,.012,0,.72,.025,.045,materials.roadLine,false,false);
  }
  row.speed = (1.7 + Math.random()*1.1) * (Math.random()<.5?-1:1);
  const count = 2 + Math.floor(Math.random()*2);
  const carSpacing = count === 2 ? 11.5 : 10.5;
  for(let i=0;i<count;i++){
    const car = new THREE.Group();
    const color = randomItem([0xe51b2b,0x2686e8,0xf1c40f,0x8b55d8,0xf1f1ed,0x24a86b,0xff7a24,0x20b8b0]);
    const paint = makeMaterial(color);
    const darkPaint = makeMaterial(new THREE.Color(color).multiplyScalar(.72));
    const glass = makeMaterial(0x080d13,.08);
    const bumper = makeMaterial(0xbfc5c7,.25);
    const tire = makeMaterial(0x17191c);
    const hub = makeMaterial(0x626b70,.25);

    // Long, squared-off voxel vehicle with a raised cabin and flat hood.
    box(car,0,.38,0,2.30,.58,.98,paint,true,true);
    box(car,.66,.70,0,.98,.08,.98,darkPaint,true,true); // hood top edge
    box(car,-.28,.82,0,1.12,.86,.94,paint,true,true); // cabin
    box(car,-.28,1.265,0,1.10,.055,.91,paint,true,true); // flat roof

    // Large black side windows and front windshield.
    box(car,-.28,.91,.481,.83,.48,.025,glass,false,false);
    box(car,-.28,.91,-.481,.83,.48,.025,glass,false,false);
    box(car,.292,.91,0,.025,.48,.78,glass,false,false);
    // White headlights and pale block bumpers at the front (+X).
    for(const z of [-.34,.34]) box(car,1.158,.40,z,.035,.16,.20,makeMaterial(0xf5f5ed),false,false);
    box(car,1.19,.17,0,.12,.17,1.04,bumper,true,true);
    box(car,-1.18,.17,0,.12,.17,1.04,bumper,true,true);
    for(const z of [-.505,.505]) {
      box(car,-1.02,.39,z,.10,.16,.035,makeMaterial(0xe72c32),false,false);
    }
    // Chunky black wheels with simple square hubs.
    for(const wx of [-.78,.78]) for(const wz of [-.53,.53]) {
      box(car,wx,.25,wz,.43,.48,.16,tire,true,true);
      box(car,wx,.25,wz+(wz>0?.085:-.085),.23,.27,.025,hub,false,false);
    }
    // Face the direction of travel: the model's front points toward +X by default.
    // Cars moving toward -X are rotated 180 degrees so they do not appear to reverse.
    car.rotation.y = row.speed < 0 ? Math.PI : 0;
    const startX = (i-(count-1)/2)*carSpacing;
    car.position.set(startX,0,0);
    row.group.add(car);
    row.objects.push({mesh:car,x:startX,width:1.55,kind:'car'});
    moving.push({row,object:row.objects[row.objects.length-1]});
  }
}
function buildRiver(row) {
  box(row.group,0,-.13,0,ROAD_WIDTH,.26,1.35,materials.water);
  const foamMat=new THREE.MeshStandardMaterial({color:0xb5e8f1,transparent:true,opacity:.48,roughness:.35});
  for(const z of [-.62,.62]) box(row.group,0,.012,z,ROAD_WIDTH,.018,.035,foamMat,false,false);
  row.speed = (2.0 + Math.random()*.55) * (Math.random()<.5?-1:1);
  const count = 5;
  const spacing = 5.2;
  for(let i=0;i<count;i++){
    const log = new THREE.Group();
    const length = 3.25 + Math.random()*.55;
    const logMat = makeMaterial(randomItem([0x9b6634,0x80502b,0xb17a42]));
    box(log,0,.13,0,length,.28,.48,logMat);
    for(const side of [-1,1]){
      const end = new THREE.Mesh(unitCylinder,logMat);
      end.rotation.z=Math.PI/2; end.scale.set(.48,.28,.28);
      end.position.x=side*length/2; log.add(end);
    }
    const startX=(i-(count-1)/2)*spacing;
    log.position.set(startX,0,0);
    row.group.add(log);
    row.objects.push({mesh:log,x:startX,width:length,kind:'log'});
    moving.push({row,object:row.objects[row.objects.length-1]});
  }
}

function buildRail(row) {
  box(row.group,0,-.12,0,ROAD_WIDTH,.24,1.35,materials.grass);
  // Rails run parallel to the traffic lane; sleepers cross beneath both rails.
  for(const z of [-.43,.43]){
    box(row.group,0,.055,z,ROAD_WIDTH,.11,.105,materials.rail);
  }
  for(let x=-8.6;x<=8.6;x+=.48) box(row.group,x,.012,0,.13,.09,1.18,materials.sleeper);
  row.speed = 0;
  row.warning = null;
  row.train = null;
}
function makeTrain(row) {
  if(row.train) return;
  const train = new THREE.Group();
  const red = makeMaterial(0xc83232);
  const cream = makeMaterial(0xf3e5c6);
  roundedBox(train,0,.42,0,2.25,.62,.94,red,.14,4);
  roundedBox(train,0,.79,-.05,1.45,.22,.9,cream,.08,4);
  for(const x of [-.62,0,.62]) box(train,x,.59,-.49,.3,.28,.035,makeMaterial(0x9dd8ed,.25));
  for(const x of [-.7,.7]) for(const z of [-.38,.38]){
    const wheel = new THREE.Mesh(unitCylinder,materials.dark);
    wheel.rotation.x=Math.PI/2;wheel.scale.set(.2,.12,.2);wheel.position.set(x,.13,z);train.add(wheel);
  }
  train.position.set(-16,0,0);
  row.group.add(train);
  row.train=train;
  row.speed=11.5;
  row.direction=1;
}
function buildRow(index) {
  const z = -index*1.35;
  let type;
  if(index<=1) type='grass';
  else {
    const roll=Math.random();
    if(roll<.48) type='grass';
    else if(roll<.76) type='road';
    else if(roll<.94) type='river';
    else type='rail';
    const previous=rows.get(index-1);
    if(previous && previous.type===type && type!=='grass' && Math.random()<.65) type='grass';
  }
  return laneGroup(z,type,index);
}
function ensureRows() {
  const lastNeeded = playerRow + VISIBLE_FRONT;
  for(let i=0;i<=lastNeeded;i++) if(!rows.has(i)) buildRow(i);
}
function clearWorld() {
  for(const child of [...world.children]) world.remove(child);
  rows.clear();moving.length=0;decorations.length=0;
  world.add(player);
}
function resetGame() {
  clearWorld();
  score=0;maxForward=0;playerX=0;playerRow=0;jump=null;
  running=false;ended=false;
  applyMapTheme('main',false);
  scoreEl.textContent='0';
  player.position.set(0,0,0);
  playerBody.position.y=0;
  playerBody.rotation.set(0,0,0);
  laneGroup(0,'grass',0);
  laneGroup(-1.35,'grass',1);
  ensureRows();
  camera.position.set(0,13,11.5);
  cameraLookTarget.set(0,0,-3.5);
  camera.lookAt(cameraLookTarget);
  startOverlay.classList.remove('hidden');
  gameOverOverlay.classList.add('hidden');
  updateCamera(0);
  render();
}
function updateCamera(dt) {
  // Keep the camera position and its look target in sync. Previously the
  // camera body eased slowly while lookAt jumped immediately, which could
  // make the player leave the frame during fast progress (notably around 60-70).
  const targetZ = -Math.max(0,playerRow-2)*1.35 - 2.0;
  const desiredPosition = new THREE.Vector3(0,13,targetZ+11.5);
  const desiredLookTarget = new THREE.Vector3(0,0,targetZ-1.5);
  const follow = 1 - Math.exp(-dt*10);
  camera.position.lerp(desiredPosition,follow);
  cameraLookTarget.lerp(desiredLookTarget,follow);
  camera.lookAt(cameraLookTarget);
}
function updateScore() {
  score=Math.max(score,maxForward);
  scoreEl.textContent=String(score);
  const nextTheme=mapThemeForScore(score);
  if(nextTheme !== currentMapTheme) applyMapTheme(nextTheme,true);
}
function showToast(message) {
  toastEl.textContent=message;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1300);
}
function movePlayer(dx,dz) {
  if(!running || ended || jump) return;
  const nextX = dx !== 0 ? THREE.MathUtils.clamp(playerX + dx, -2, 2) : playerX;
  const nextRow = dz !== 0 ? playerRow + 1 : playerRow;
  if(nextX === playerX && dx !== 0) return;

  // Trees are solid obstacles: stop the move instead of ending the run.
  const destinationRow = rows.get(nextRow);
  if(destinationRow?.type === 'grass') {
    // Movement happens on five discrete columns. Only the tree in the
    // exact destination column blocks the player; nearby trees must not
    // make a visually open gap impossible to pass through.
    const targetLane = Math.round(nextX);
    const blocked = destinationRow.obstacles.some(obstacle =>
      obstacle.lane === targetLane
    );
    if(blocked) {
      showToast('🌳 درخت راه را بسته؛ یک خانه چپ یا راست برو');
      return;
    }
  }

  playerX = nextX;
  if(dz !== 0) {
    playerRow = nextRow;
    maxForward = Math.max(maxForward, playerRow);
    updateScore();
    ensureRows();
  }
  const target = new THREE.Vector3(playerX * LANE_WIDTH, 0, -playerRow * 1.35);
  jump = {from:player.position.clone(), to:target, elapsed:0, duration:.17};
  playerBody.rotation.z = dx * .22;
  if(playerRow > maxForward + VISIBLE_FRONT - 3) ensureRows();
}
function checkLanding() {
  const row=rows.get(playerRow);
  if(!row) return;
  if(row.type==='river') {
    const log=row.objects.find(o=>Math.abs(o.x-playerX*LANE_WIDTH)<(o.width/2+.22));
    if(!log) { finishGame('الوار زیر پایت نیست؛ دوباره تلاش کن'); return; }
    player.userData.riding=log;
  } else player.userData.riding=null;
}
function finishGame(reason) {
  if(ended) return;
  running=false;ended=true;jump=null;
  best=Math.max(best,score);
  localStorage.setItem(BEST_KEY,String(best));
  bestEl.textContent=String(best);
  finalText.textContent=`${reason} امتیاز تو: ${score}`;
  gameOverOverlay.classList.remove('hidden');
}
function startGame() {
  if(ended) resetGame();
  running=true;ended=false;
  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  lastTime=performance.now();
  if(!animationId) animationId=requestAnimationFrame(loop);
}
function animatePlayer(dt) {
  if(!jump) return;
  jump.elapsed+=dt;
  const t=Math.min(1,jump.elapsed/jump.duration);
  const eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  player.position.lerpVectors(jump.from,jump.to,eased);
  player.position.y=Math.sin(t*Math.PI)*.48;
  if(t>=1) {
    player.position.copy(jump.to);player.position.y=0;jump=null;
    playerBody.rotation.z=0;
    checkLanding();
    const row=rows.get(playerRow);
    if(row?.type==='rail' && row.train && Math.abs(row.train.position.x-playerX*LANE_WIDTH)<2.05) finishGame('قطار بهت برخورد کرد!');
  }
}
function updateTraffic(dt) {
  const elapsedSpeed=1+Math.min(score*.018,.9);
  for(const row of rows.values()) {
    if(row.type==='road') {
      for(const obj of row.objects) {
        obj.x+=row.speed*elapsedSpeed*dt;
        if(row.speed>0 && obj.x>14) obj.x=-14;
        if(row.speed<0 && obj.x<-14) obj.x=14;
        obj.mesh.position.x=obj.x;
      }
    } else if(row.type==='river') {
      for(const obj of row.objects) {
        obj.x+=row.speed*dt;
        if(row.speed>0 && obj.x>14) obj.x=-14;
        if(row.speed<0 && obj.x<-14) obj.x=14;
        obj.mesh.position.x=obj.x;
      }
    } else if(row.type==='rail') {
      const dist=playerRow-row.index;
      if(!row.train && !row.warning && Math.abs(dist)<7 && Math.random()<dt*.18) {
        row.warning=2.0;
        if(row.index===playerRow || Math.abs(dist)<=2) showToast('⚠️ قطار نزدیک می‌شود!');
      }
      if(row.warning!==null) {
        row.warning-=dt;
        if(row.warning<=0) {row.warning=null;makeTrain(row);}
      }
      if(row.train) {
        row.train.position.x+=row.speed*dt;
        if(row.train.position.x>17) {row.group.remove(row.train);row.train=null;row.warning=null;}
      }
    }
  }
  const current=rows.get(playerRow);
  if(current?.type==='road') {
    for(const obj of current.objects) {
      if(Math.abs(obj.x-playerX*LANE_WIDTH)<.78) {finishGame('ماشین بهت برخورد کرد!');break;}
    }
  }
  if(current?.type==='river' && !jump) {
    const riding=player.userData.riding;
    if(!riding || !current.objects.includes(riding)) {finishGame('در آب افتادی!');return;}
    playerX += (current.speed*dt)/LANE_WIDTH;
    playerX=THREE.MathUtils.clamp(playerX,-3.2,3.2);
    player.position.x=playerX*LANE_WIDTH;
    if(Math.abs(playerX*LANE_WIDTH-riding.x)>riding.width/2+.15) finishGame('از کنده جا ماندی!');
  }
  const rail=rows.get(playerRow);
  if(rail?.type==='rail' && rail.train && Math.abs(rail.train.position.x-playerX*LANE_WIDTH)<2.05) finishGame('قطار بهت برخورد کرد!');
}
function cleanupRows() {
  const min=playerRow-VISIBLE_BACK;
  for(const [index,row] of rows) {
    if(index<min) {
      world.remove(row.group);rows.delete(index);
    }
  }
}
function loop(now) {
  animationId=0;
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  if(running) {
    if(materials.water.map) materials.water.map.offset.x=(materials.water.map.offset.x+dt*.018)%1;
    animatePlayer(dt);
    updateTraffic(dt);
    cleanupRows();
    updateCamera(dt);
  }
  render();
  if(running) animationId=requestAnimationFrame(loop);
}
let renderWidth=0, renderHeight=0;
function render() {
  if(!renderer) return;
  const w=stage.clientWidth,h=stage.clientHeight;
  if(w&&h && (w!==renderWidth || h!==renderHeight)) {
    renderWidth=w; renderHeight=h;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  renderer.render(scene,camera);
}
function handleMove(kind) {
  if(!running) return;
  if(kind==='forward') movePlayer(0,1);
  if(kind==='left') movePlayer(-1,0);
  if(kind==='right') movePlayer(1,0);
}
document.getElementById('chickenSkin').addEventListener('click',()=>applySkin('chicken'));
document.getElementById('suitSkin').addEventListener('click',()=>applySkin('suit'));

let pointerStart=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.overlay') || !running) return;
  pointerStart={x:e.clientX,y:e.clientY,id:e.pointerId};
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
},{passive:false});
stage.addEventListener('pointerup',e=>{
  if(!pointerStart || pointerStart.id!==e.pointerId) return;
  const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;
  pointerStart=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) {handleMove('forward');return;}
  if(Math.abs(dx)>Math.abs(dy)) handleMove(dx>0?'right':'left');
  else if(dy<0) handleMove('forward');
  else showToast('برای پیشروی، انگشت را به بالا بکش');
});
stage.addEventListener('pointercancel',()=>pointerStart=null);
document.addEventListener('keydown',e=>{
  const keys={ArrowUp:'forward',w:'forward',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
  if(keys[e.key]){e.preventDefault();handleMove(keys[e.key]);}
});
window.addEventListener('resize',render);
if (window.visualViewport) window.visualViewport.addEventListener('resize', render);
document.addEventListener('visibilitychange',()=>{if(document.hidden && running){running=false;showToast('بازی متوقف شد');}});
if(renderer) resetGame();
</script>
</body>
</html>
