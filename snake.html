<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>GOZAR GAMES | Snake</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');
:root{--bg:#080808;--green:#42d66b;--dark:#102b18;--ink:#08200f;--muted:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f5f5;font-family:Vazirmatn,sans-serif;min-height:100vh;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
.app{max-width:520px;margin:auto;padding:16px 15px 30px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{background:#171717;border:1px solid #333;border-radius:12px;color:#fff;padding:9px 14px}
.brand{font-weight:900;letter-spacing:.5px}.brand span{color:var(--green)}
.scorebar{display:flex;justify-content:space-between;align-items:center;margin:12px 2px;font-weight:900}
.score{font-size:27px;color:var(--green);direction:ltr}
.best{font-size:12px;color:#aaa}
.color-panel{display:grid;gap:9px;margin:4px 0 13px;padding:11px 12px;background:#141414;border:1px solid #292929;border-radius:14px}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.color-label{font-size:12px;font-weight:800;color:#ddd;white-space:nowrap}
.swatches{display:flex;align-items:center;gap:8px;direction:ltr}
.swatch{width:25px;height:25px;padding:0;border-radius:50%;background:var(--swatch);border:2px solid #ffffff55;box-shadow:inset 0 0 0 1px #0003;position:relative}
.swatch.active{outline:2px solid #fff;outline-offset:2px}
.board-wrap{background:var(--board-color,#42d66b);border:5px solid var(--board-border,#269e4a);border-radius:19px;padding:8px;box-shadow:0 0 25px #42d66b20}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1.35;touch-action:none;border:3px dotted #123b1c;border-radius:5px;background:var(--board-color,#42d66b)}
.hint{text-align:center;color:#bdbdbd;font-size:12px;margin:12px 0 15px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid #383838;border-radius:13px;background:#191919;color:#bbb;padding:12px 4px;font-weight:900;font-size:12px}
.mode.active{background:var(--green);color:var(--ink);border-color:#72f28e;box-shadow:0 0 14px #42d66b33}
.actions{display:flex;gap:10px;margin-top:13px}
.action{flex:1;border:0;border-radius:12px;padding:12px;background:#292929;color:#fff;font-weight:800}
.action.primary{background:var(--green);color:var(--ink)}
.message{text-align:center;color:#aaa;font-size:12px;min-height:22px;margin:12px 0}
.foot{text-align:center;color:#777;font-size:10px;margin-top:14px}
@media(min-width:430px){canvas{aspect-ratio:1/1.15}.mode{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backButton">← بازگشت</button>
    <div class="brand">GOZAR <span>GAMES</span></div>
  </header>

  <div class="scorebar">
    <div><div class="score" id="score">00000</div><div class="best">امتیاز</div></div>
    <div style="text-align:left"><div class="score" id="best">00000</div><div class="best">BEST</div></div>
  </div>

  <section class="color-panel" aria-label="تنظیم رنگ بازی">
    <div class="color-row">
      <span class="color-label">رنگ پس‌زمینه</span>
      <div class="swatches" id="backgroundSwatches">
        <button class="swatch active" data-color="#42d66b" style="--swatch:#42d66b" aria-label="سبز"></button>
        <button class="swatch" data-color="#58b9ff" style="--swatch:#58b9ff" aria-label="آبی"></button>
        <button class="swatch" data-color="#b58cff" style="--swatch:#b58cff" aria-label="بنفش"></button>
        <button class="swatch" data-color="#ff9fbd" style="--swatch:#ff9fbd" aria-label="صورتی"></button>
        <button class="swatch" data-color="#f2c66d" style="--swatch:#f2c66d" aria-label="طلایی"></button>
      </div>
    </div>
    <div class="color-row">
      <span class="color-label">رنگ مار</span>
      <div class="swatches" id="snakeSwatches">
        <button class="swatch active" data-color="#0b421d" style="--swatch:#0b421d" aria-label="سبز تیره"></button>
        <button class="swatch" data-color="#123a80" style="--swatch:#123a80" aria-label="آبی تیره"></button>
        <button class="swatch" data-color="#632c91" style="--swatch:#632c91" aria-label="بنفش تیره"></button>
        <button class="swatch" data-color="#9a2851" style="--swatch:#9a2851" aria-label="زرشکی"></button>
        <button class="swatch" data-color="#713d16" style="--swatch:#713d16" aria-label="قهوه‌ای"></button>
      </div>
    </div>
  </section>

  <div class="board-wrap">
    <canvas id="game" width="360" height="486" aria-label="بازی مار"></canvas>
  </div>

  <div class="hint" id="hint">برای تغییر جهت مار، روی صفحه بازی انگشتت رو بکش.</div>

  <div class="modes">
    <button class="mode active" data-mode="nowalls">No walls</button>
    <button class="mode" data-mode="walls">Walls</button>
    <button class="mode" data-mode="advanced">Advanced</button>
  </div>

  <div class="actions">
    <button class="action primary" id="startBtn">شروع بازی</button>
    <button class="action" id="pauseBtn">توقف</button>
    <button class="action" id="restartBtn">شروع مجدد</button>
  </div>

  <div class="message" id="message">حالت بازی رو انتخاب کن و آماده شو!</div>


  <div class="foot">GOZAR GAMES · SNAKE</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const messageEl = document.getElementById('message');
const hintEl = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');

const COLS = 20, ROWS = 27;
const CELL = canvas.width / COLS;
const modes = {
  nowalls: { label: 'No walls', speed: 145, wrap: true, acceleration: false },
  walls: { label: 'Walls', speed: 145, wrap: false, acceleration: false },
  advanced: { label: 'Advanced', speed: 112, wrap: false, acceleration: true }
};

let mode = 'nowalls';
let snake, food, direction, nextDirection, score, timer;
let running = false, ended = false, lastTick = 0, touchStart = null;
let normalFoods = 0, bonusFood = null, bonusExpiryTimer = null;
let biteUntil = 0, swallowed = null, visualFrame = null, scorePopup = null;

const defaultBackground = '#42d66b';
const defaultSnake = '#0b421d';
let backgroundColor = localStorage.getItem('gozar_snake_background') || defaultBackground;
let snakeColor = localStorage.getItem('gozar_snake_color') || defaultSnake;
const foodColor = '#f04444';

function applyColors(){
  const board = document.querySelector('.board-wrap');
  const canvasEl = document.getElementById('game');
  document.documentElement.style.setProperty('--green', backgroundColor);
  board.style.setProperty('--board-color', backgroundColor);
  board.style.setProperty('--board-border', shadeColor(backgroundColor, -18));
  canvasEl.style.backgroundColor = backgroundColor;
  document.querySelectorAll('#backgroundSwatches .swatch').forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===backgroundColor.toLowerCase()));
  document.querySelectorAll('#snakeSwatches .swatch').forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===snakeColor.toLowerCase()));
  document.querySelector('.brand span').style.color = backgroundColor;
  document.querySelectorAll('.mode.active,.action.primary').forEach(el=>el.style.backgroundColor=backgroundColor);
  draw();
}
function shadeColor(hex, percent){
  const n=parseInt(hex.slice(1),16), amt=Math.round(2.55*percent);
  const r=Math.max(0,Math.min(255,(n>>16)+amt));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  const b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
document.getElementById('backgroundSwatches').addEventListener('click',e=>{
  const btn=e.target.closest('.swatch'); if(!btn)return;
  backgroundColor=btn.dataset.color;
  localStorage.setItem('gozar_snake_background',backgroundColor);
  applyColors();
});
document.getElementById('snakeSwatches').addEventListener('click',e=>{
  const btn=e.target.closest('.swatch'); if(!btn)return;
  snakeColor=btn.dataset.color;
  localStorage.setItem('gozar_snake_color',snakeColor);
  applyColors();
});

function keyBest(){ return 'gozar_snake_best_' + mode; }
function getBest(){ return Number(localStorage.getItem(keyBest()) || 0); }
function pad(n){ return String(n).padStart(5, '0'); }

function updateScore(){
  scoreEl.textContent = pad(score);
  bestEl.textContent = pad(getBest());
}

function resetGame(){
  clearInterval(timer);
  running = false;
  ended = false;
  score = 0;
  snake = [
    {x:9,y:13},{x:8,y:13},{x:7,y:13}
  ];
  direction = {x:1,y:0};
  nextDirection = {x:1,y:0};
  clearTimeout(bonusExpiryTimer);
  normalFoods = 0; bonusFood = null; biteUntil = 0; swallowed = null; scorePopup = null;
  if (visualFrame) cancelAnimationFrame(visualFrame); visualFrame = null;
  food = makeFood();
  updateScore();
  startBtn.textContent = 'شروع بازی';
  pauseBtn.textContent = 'توقف';
  messageEl.textContent = 'برای شروع آماده‌ای؟';
  draw();
}

function makeFood(){
  let p;
  do {
    p = {x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===p.x && s.y===p.y) || (bonusFood && p.x===bonusFood.x && p.y===bonusFood.y));
  return p;
}

function draw(){
  ctx.fillStyle = backgroundColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // subtle pixel grid
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      if((x+y)%2===0) ctx.fillRect(x*CELL+CELL/2-1,y*CELL+CELL/2-1,2,2);
    }
  }

  // Normal food
  ctx.fillStyle = '#f04444';
  ctx.fillRect(food.x*CELL+CELL*.25,food.y*CELL+CELL*.25,CELL*.5,CELL*.5);
  ctx.fillStyle = '#ffd6d6';
  ctx.fillRect(food.x*CELL+CELL*.34,food.y*CELL+CELL*.31,CELL*.09,CELL*.09);

  // Large bonus food with a visible five-second countdown
  if (bonusFood) {
    const elapsed = Date.now() - bonusFood.started;
    const remaining = Math.max(0, 1 - elapsed / 5000);
    const cx = (bonusFood.x + .5) * CELL, cy = (bonusFood.y + .5) * CELL;
    const pulse = 1 + Math.sin(Date.now()/90) * .08;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ffe36e';
    ctx.beginPath();
    for (let k=0;k<10;k++) {
      const r = k%2===0 ? CELL*.48 : CELL*.22;
      const a = -Math.PI/2 + k*Math.PI/5;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a4d00'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#fff4bd'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx,cy,CELL*.62,-Math.PI/2,-Math.PI/2+Math.PI*2*remaining);
    ctx.stroke();
  }

  // Snake body and head
  snake.forEach((part,i)=>{
    ctx.fillStyle = i===0 ? shadeColor(snakeColor,-18) : snakeColor;
    ctx.fillRect(part.x*CELL+1,part.y*CELL+1,CELL-2,CELL-2);

    if(i===0){
      // The mouth opens only during the actual bite animation.
      const jawOpen = Date.now() < biteUntil;
      const eye = Math.max(2,CELL*.12);

      ctx.fillStyle = '#ffffff';
      if(direction.x !== 0){
        ctx.fillRect(part.x*CELL+CELL*.57,part.y*CELL+CELL*.2,eye,eye);
        ctx.fillRect(part.x*CELL+CELL*.57,part.y*CELL+CELL*.68,eye,eye);
      }else{
        ctx.fillRect(part.x*CELL+CELL*.2,part.y*CELL+CELL*.57,eye,eye);
        ctx.fillRect(part.x*CELL+CELL*.68,part.y*CELL+CELL*.57,eye,eye);
      }

      if(jawOpen){
        ctx.fillStyle = backgroundColor;
        const cx = part.x*CELL + CELL/2;
        const cy = part.y*CELL + CELL/2;
        const mouth = CELL*.38;
        ctx.beginPath();
        if(direction.x === 1){
          ctx.moveTo(cx+CELL*.12,cy-mouth); ctx.lineTo(cx+CELL*.12,cy+mouth); ctx.lineTo(cx+CELL*.55,cy); 
        }else if(direction.x === -1){
          ctx.moveTo(cx-CELL*.12,cy-mouth); ctx.lineTo(cx-CELL*.12,cy+mouth); ctx.lineTo(cx-CELL*.55,cy);
        }else if(direction.y === 1){
          ctx.moveTo(cx-mouth,cy+CELL*.12); ctx.lineTo(cx+mouth,cy+CELL*.12); ctx.lineTo(cx,cy+CELL*.55);
        }else{
          ctx.moveTo(cx-mouth,cy-CELL*.12); ctx.lineTo(cx+mouth,cy-CELL*.12); ctx.lineTo(cx,cy-CELL*.55);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  });

  // A small piece of food visibly travels from the head into the body.
  if (swallowed) {
    const progress = Math.min(1, (Date.now()-swallowed.started)/520);
    const maxSegment = Math.min(snake.length-1, 5);
    const segmentPosition = progress * maxSegment;
    const index = Math.min(maxSegment, Math.floor(segmentPosition));
    const fraction = segmentPosition-index;
    const a = snake[index] || snake[0];
    const b = snake[Math.min(index+1, snake.length-1)] || a;
    const px = ((a.x + (b.x-a.x)*fraction)+.5)*CELL;
    const py = ((a.y + (b.y-a.y)*fraction)+.5)*CELL;
    ctx.fillStyle = swallowed.color;
    ctx.beginPath(); ctx.arc(px,py,CELL*.19,0,Math.PI*2); ctx.fill();
  }

  if (scorePopup) {
    const elapsed = Date.now()-scorePopup.started;
    if (elapsed < 700) {
      ctx.save(); ctx.globalAlpha = 1-elapsed/700;
      ctx.fillStyle = scorePopup.color; ctx.textAlign='center';
      ctx.font = '900 18px Vazirmatn, sans-serif';
      ctx.fillText(scorePopup.text, scorePopup.x, scorePopup.y-elapsed*.035);
      ctx.restore();
    } else scorePopup = null;
  }

  if(!running){
    ctx.fillStyle = '#062b12';
    ctx.textAlign = 'center';
    ctx.font = '900 21px Vazirmatn, sans-serif';
    const title = ended ? 'GAME OVER' : 'SNAKE';
    ctx.fillText(title,canvas.width/2,canvas.height/2-8);
    ctx.font = '700 12px Vazirmatn, sans-serif';
    ctx.fillText(ended ? 'برای بازی دوباره شروع را بزن' : 'برای شروع روی صفحه بکش',canvas.width/2,canvas.height/2+20);
  }
}

function startBiteAnimation(color='#fff2a8', points=10){
  const now = Date.now();
  biteUntil = now + 260;
  swallowed = { started: now, color };
  scorePopup = { started: now, text: '+' + points, color: points===50 ? '#ffe36e' : '#ffffff', x:(snake[0].x+.5)*CELL, y:(snake[0].y+.2)*CELL };
  runVisualAnimation();
}

function runVisualAnimation(){
  if (visualFrame) return;
  const frame = () => {
    draw();
    const now = Date.now();
    const biteActive = now < biteUntil;
    const swallowActive = swallowed && now-swallowed.started < 520;
    const popupActive = scorePopup && now-scorePopup.started < 700;
    if (biteActive || swallowActive || popupActive || bonusFood) {
      visualFrame = requestAnimationFrame(frame);
    } else {
      visualFrame = null;
      swallowed = null;
    }
  };
  visualFrame = requestAnimationFrame(frame);
}

function createBonusFood(){
  const free=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if(!snake.some(part=>part.x===x&&part.y===y)&&!(food.x===x&&food.y===y))free.push({x,y});
  if(!free.length)return;
  bonusFood={...free[Math.floor(Math.random()*free.length)],started:Date.now()};
  runVisualAnimation();
  clearTimeout(bonusExpiryTimer);
  bonusExpiryTimer=setTimeout(()=>{bonusFood=null;draw();},5000);
}
function startGame(){
  if(ended) resetGame();
  if(running) return;
  running = true;
  startBtn.textContent = 'در حال بازی';
  messageEl.textContent = 'بازی شروع شد؛ موفق باشی!';
  hintEl.textContent = 'برای تغییر جهت مار، فقط روی صفحه بازی انگشتت رو بکش.';
  clearInterval(timer);
  timer = setInterval(tick, modes[mode].speed);
  draw();
}

function pauseGame(){
  if(!running) return;
  running = false;
  clearInterval(timer);
  startBtn.textContent = 'ادامه بازی';
  messageEl.textContent = 'بازی متوقف شد.';
  draw();
}

function finishGame(){
  running = false;
  ended = true;
  clearInterval(timer);
  const oldBest = getBest();
  if(score > oldBest) localStorage.setItem(keyBest(),String(score));
  updateScore();
  startBtn.textContent = 'بازی دوباره';
  messageEl.textContent = 'بازی تموم شد! امتیاز: ' + score;
  draw();
}

function tick(){
  if(!running) return;
  direction = nextDirection;
  let head = {x:snake[0].x+direction.x,y:snake[0].y+direction.y};

  if(modes[mode].wrap){
    head.x = (head.x+COLS)%COLS;
    head.y = (head.y+ROWS)%ROWS;
  }else if(head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS){
    finishGame(); return;
  }

  const eating = head.x===food.x && head.y===food.y;
  const eatingBonus = !!bonusFood && head.x===bonusFood.x && head.y===bonusFood.y;
  const bodyToCheck = (eating || eatingBonus) ? snake : snake.slice(0,-1);
  if(bodyToCheck.some(p=>p.x===head.x && p.y===head.y)){
    finishGame(); return;
  }

  snake.unshift(head);
  if(eating || eatingBonus){
    if(eatingBonus){
      score+=50;
      startBiteAnimation('#ffe36e',50);
      bonusFood=null;clearTimeout(bonusExpiryTimer);
      messageEl.textContent='غذای ویژه رو خوردی! +۵۰ امتیاز';
    }else{
      score+=10;
      startBiteAnimation(foodColor,10);
      normalFoods++;food=makeFood();
      if(normalFoods%3===0){
        createBonusFood();
        messageEl.textContent='غذای ویژه ظاهر شد؛ فقط ۵ ثانیه فرصت داری!';
      }
    }
    if(score>getBest())localStorage.setItem(keyBest(),String(score));
    updateScore();
    if(modes[mode].acceleration && score%50===0){
      clearInterval(timer);timer=setInterval(tick,Math.max(55,modes[mode].speed-score/10));
    }
  }else{snake.pop();}
  draw();
}

function changeDirection(dir){
  const dirs = {
    up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}
  };
  const chosen = dirs[dir];
  if(!chosen) return;
  if(chosen.x === -direction.x && chosen.y === -direction.y) return;
  nextDirection = chosen;
  if(!running && !ended) startGame();
}

document.querySelectorAll('[data-mode]').forEach(button=>{
  button.addEventListener('click',()=>{
    if(running) pauseGame();
    mode = button.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));
    resetGame();
    bestEl.textContent = pad(getBest());
    messageEl.textContent = 'حالت ' + modes[mode].label + ' انتخاب شد.';
  });
});


document.addEventListener('keydown',e=>{
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(map[e.key]){e.preventDefault();changeDirection(map[e.key]);}
});

// Responsive swipe controls: react as soon as the finger moves far enough.
// CSS touch-action:none on the canvas prevents page scrolling without blocking pointer events.
let activePointerId = null;
let swipeHandled = false;
const SWIPE_THRESHOLD = 10;

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  activePointerId = e.pointerId;
  swipeHandled = false;
  touchStart = { x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointerId || !touchStart || swipeHandled) return;
  e.preventDefault();
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return;
  swipeHandled = true;
  if (Math.abs(dx) > Math.abs(dy)) changeDirection(dx > 0 ? 'right' : 'left');
  else changeDirection(dy > 0 ? 'down' : 'up');
}, { passive: false });

function finishSwipe(e) {
  if (e.pointerId !== activePointerId) return;
  touchStart = null;
  activePointerId = null;
  swipeHandled = false;
}
canvas.addEventListener('pointerup', finishSwipe);
canvas.addEventListener('pointercancel', finishSwipe);
canvas.addEventListener('lostpointercapture', finishSwipe);

startBtn.addEventListener('click',()=>running?null:startGame());
pauseBtn.addEventListener('click',pauseGame);
document.getElementById('restartBtn').addEventListener('click',resetGame);
document.getElementById('backButton').addEventListener('click',()=>{
  if(tg && tg.close) tg.close();
  else if(history.length>1) history.back();
  else location.href='/';
});

resetGame();
</script>
</body>
</html>
