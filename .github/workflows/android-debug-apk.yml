name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'snake.html'
      - 'crossy.html'
      - 'games/battle-arena/**'
      - 'functions/**'
      - '.github/workflows/**'
  push:
    branches:
      - feat/android-capacitor-shell
      - fix/android-login-entry
    paths:
      - 'android-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug-apk.yml'
      - 'index.html'
      - 'snake.html'
      - 'crossy.html'
      - 'games/battle-arena/**'
      - 'functions/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check android-app/native-bridge.js
          node --check android-app/scripts/build-web.mjs
          node --check android-app/scripts/smoke-check.mjs
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build local game bundle
        run: npm run build:web

      - name: Check packaged game files
        run: npm run check:android-web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set increasing Android app version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s, count = re.subn(r'versionCode[ ]+[0-9]+', f"versionCode {os.environ['BUILD_NUMBER']}", s, count=1)
          if count != 1:
              raise SystemExit('Could not find versionCode in app/build.gradle')
          s = re.sub(r'versionName[ ]+\"[^\"]+\"', f'versionName "1.0.{os.environ["BUILD_NUMBER"]}"', s, count=1)
          p.write_text(s)
          print(f"Configured versionCode {os.environ['BUILD_NUMBER']}")
          PY

      - name: Configure persistent debug signing key
        env:
          GOZAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.GOZAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOZAR_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: GOZAR_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$GOZAR_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "GOZAR_ANDROID_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Force Gradle to use the persistent signing key
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text()

          def block_span(source, opening):
              brace = source.find('{', opening)
              if brace < 0:
                  raise SystemExit('Missing opening brace')
              depth = 0
              quote = None
              escaped = False
              for i in range(brace, len(source)):
                  c = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in ("'", '"'):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return brace, i + 1
              raise SystemExit('Unclosed Gradle block')

          def find_named_block(source, name, start=0):
              m = re.search(r'\b' + re.escape(name) + r'\s*\{', source[start:])
              if not m:
                  return None
              opening = start + m.start()
              left, right = block_span(source, opening)
              return opening, left, right

          android = find_named_block(s, 'android')
          if not android:
              raise SystemExit('Missing android block')
          _, android_open, android_end = android

          signing = find_named_block(s, 'signingConfigs', android_open)
          signing_text = '''
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("GOZAR_ANDROID_KEYSTORE_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          if signing:
              _, signing_open, signing_end = signing
              debug = find_named_block(s[signing_open:signing_end], 'debug')
              if debug:
                  _, d_open, d_end = debug
                  abs_open = signing_open + d_open
                  abs_end = signing_open + d_end
                  s = s[:abs_open + 1] + '''
                      storeFile file(System.getenv("GOZAR_ANDROID_KEYSTORE_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  ''' + s[abs_end - 1:]
              else:
                  s = s[:signing_end - 1] + '''
                  debug {
                      storeFile file(System.getenv("GOZAR_ANDROID_KEYSTORE_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              ''' + s[signing_end - 1:]
          else:
              s = s[:android_open + 1] + signing_text + s[android_open + 1:]

          # Explicitly attach the persistent signing config to buildTypes.debug.
          bt = find_named_block(s, 'buildTypes')
          if not bt:
              raise SystemExit('Missing buildTypes block')
          _, bt_open, bt_end = bt
          debug = find_named_block(s[bt_open:bt_end], 'debug')
          if debug:
              _, d_open, d_end = debug
              abs_open = bt_open + d_open
              abs_end = bt_open + d_end
              body = s[abs_open + 1:abs_end - 1]
              body = re.sub(r'(?m)^\s*signingConfig\s+signingConfigs\.debug\s*\n?', '', body)
              s = s[:abs_open + 1] + '\n        signingConfig signingConfigs.debug\n' + body + s[abs_end - 1:]
          else:
              s = s[:bt_end - 1] + '''
                  debug {
                      signingConfig signingConfigs.debug
                  }
              ''' + s[bt_end - 1:]

          p.write_text(s)
          print('Configured signingConfigs.debug and buildTypes.debug.')
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signing certificate
        run: |
          expected="$(keytool -list -v -keystore "$GOZAR_ANDROID_KEYSTORE_PATH" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          actual="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':')"
          echo "Expected signing certificate: $expected"
          echo "Actual APK signing certificate: $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "APK was not signed with the persistent GOZAR key."
            exit 1
          fi
          echo "APK signing certificate verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gozar-games-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
