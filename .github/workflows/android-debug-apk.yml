name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'snake.html'
      - 'crossy.html'
      - 'games/battle-arena/**'
      - 'functions/**'
      - '.github/workflows/**'
  push:
    branches:
      - feat/android-capacitor-shell
      - fix/android-login-entry
    paths:
      - 'android-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug-apk.yml'
      - 'index.html'
      - 'snake.html'
      - 'crossy.html'
      - 'games/battle-arena/**'
      - 'functions/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check android-app/native-bridge.js
          node --check android-app/scripts/build-web.mjs
          node --check android-app/scripts/smoke-check.mjs
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build local game bundle
        run: npm run build:web

      - name: Check packaged game files
        run: npm run check:android-web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set increasing Android app version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s, count = re.subn(r'versionCode[ ]+[0-9]+', f"versionCode {os.environ['BUILD_NUMBER']}", s, count=1)
          if count != 1:
              raise SystemExit('Could not find versionCode in app/build.gradle')
          s = re.sub(r'versionName[ ]+\"[^\"]+\"', f'versionName "1.0.{os.environ["BUILD_NUMBER"]}"', s, count=1)
          p.write_text(s)
          print(f"Configured versionCode {os.environ['BUILD_NUMBER']}")
          PY

      - name: Configure persistent debug signing key
        env:
          GOZAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.GOZAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOZAR_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: GOZAR_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$GOZAR_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gozar-games-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
