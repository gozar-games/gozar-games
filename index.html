
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>GOZAR GAMES</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#080808;
  --red:#ed1725;
  --white:#f5f5f5;
  --gray:#999;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Vazirmatn,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
}

button{font-family:inherit;color:inherit;cursor:pointer}

.app{max-width:520px;margin:auto;padding:18px 17px}

.header,.profile,.user,.coins{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header{margin-bottom:25px}
.brand{font-size:19px;font-weight:900}
.brand span,.nav-item.active{color:var(--red)}

.settings{
  background:#171717;
  border:1px solid #333;
  border-radius:13px;
  width:43px;
  height:43px;
  font-size:20px;
  color:white;
}

.profile{gap:10px;margin-bottom:22px}
.user{justify-content:flex-start;gap:11px}

.avatar{
  width:57px;
  height:57px;
  border-radius:50%;
  border:2px solid var(--red);
  background:#1a1a1a;
  display:grid;
  place-items:center;
  font-size:27px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-name{font-weight:800;font-size:15px}
.level{font-size:12px;color:var(--gray);margin-top:3px}

.progress{
  width:105px;
  height:5px;
  background:#333;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}

.progress div{
  width:35%;
  height:100%;
  background:var(--red);
}

.coins{
  gap:8px;
  background:#151515;
  border:1px solid #303030;
  border-radius:30px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
}

.coin{font-size:19px}

.plus{
  background:var(--red);
  border:0;
  border-radius:50%;
  width:27px;
  height:27px;
  font-size:20px;
}

/* Daily reward card */

.daily-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#251012,#141414 65%);
  border:1px solid #642027;
  border-radius:19px;
  padding:17px;
  margin-bottom:30px;
  box-shadow:0 8px 25px #ed172510;
}

.daily-card:before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  background:#ed172515;
  left:-45px;
  top:-65px;
  pointer-events:none;
}

.daily-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:relative;
}

.daily-heading{
  display:flex;
  align-items:center;
  gap:10px;
}

.daily-icon{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  background:#ed17251c;
  border:1px solid #ed172544;
  border-radius:13px;
  font-size:25px;
}

.daily-title{
  font-size:15px;
  font-weight:900;
}

.daily-subtitle{
  font-size:11px;
  color:#aaa;
  margin-top:4px;
}

.streak-badge{
  background:#ed17251c;
  color:#ff6871;
  border:1px solid #ed172544;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  white-space:nowrap;
}

.daily-divider{
  height:1px;
  background:#ffffff12;
  margin:15px 0;
}

.daily-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:relative;
}

.reward-label{
  color:#aaa;
  font-size:11px;
}

.reward-value{
  font-size:23px;
  font-weight:900;
  color:#fff;
  margin-top:3px;
}

.reward-value span{
  color:#ff4b56;
  font-size:13px;
}

.claim-button{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  min-width:125px;
  background:var(--red);
  color:white;
  font-size:12px;
  font-weight:900;
  box-shadow:0 5px 16px #ed172533;
  transition:.2s;
}

.claim-button:active:not(:disabled){
  transform:scale(.96);
}

.claim-button:disabled{
  cursor:not-allowed;
  opacity:.65;
  box-shadow:none;
}

.claim-button.claimed{
  background:#252525;
  color:#aaa;
  border:1px solid #444;
}

.daily-message{
  color:#aaa;
  font-size:10px;
  margin-top:12px;
  position:relative;
  min-height:15px;
}

.hero{text-align:center;margin-bottom:30px}
.game-icon{font-size:51px}

.logo{
  font-size:clamp(37px,10vw,55px);
  font-weight:900;
  letter-spacing:-2px;
  line-height:1.1;
}

.logo span{color:var(--red)}
.slogan{color:#aaa;font-size:13px;margin-top:12px}

.main-button{
  width:100%;
  border:1px solid var(--red);
  border-radius:19px;
  background:linear-gradient(120deg,#35090d,#111 75%);
  box-shadow:0 0 17px #ed172522;
  padding:19px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:19px;
  text-align:right;
}

.play-icon{font-size:34px}
.main-title{font-size:21px;font-weight:900}
.main-sub{color:#aaa;font-size:12px;margin-top:3px}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.menu-card{
  min-height:105px;
  background:linear-gradient(145deg,#202020,#101010);
  border:1px solid #333;
  border-radius:17px;
  padding:13px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:right;
}

.menu-card:active{
  border-color:var(--red);
  transform:scale(.97);
}

.card-icon{font-size:29px;min-width:35px;text-align:center}
.card-title{font-size:14px;font-weight:800}
.card-sub{font-size:10px;color:var(--gray);margin-top:5px}

.info{
  background:#151515;
  border:1px solid #333;
  border-right:3px solid var(--red);
  border-radius:13px;
  margin-top:19px;
  padding:14px;
  color:#ccc;
  font-size:12px;
  text-align:center;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:520px;
  margin:auto;
  display:flex;
  justify-content:space-around;
  background:#111;
  border-top:1px solid #303030;
  padding:11px 5px calc(11px + env(safe-area-inset-bottom));
  z-index:10;
}

.nav-item{
  background:transparent;
  border:0;
  color:#999;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  min-width:65px;
}

.nav-icon{font-size:21px}
.nav-item.active{font-weight:800}

.toast{
  position:fixed;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  border-radius:12px;
  padding:12px 18px;
  font-size:12px;
  white-space:nowrap;
  display:none;
  z-index:20;
}

@media(max-width:360px){
  .menu-card{padding:10px 7px;gap:6px}
  .card-title{font-size:12px}
  .card-icon{font-size:24px;min-width:28px}
  .claim-button{min-width:110px;padding:10px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">GOZAR <span>GAMES</span></div>
  <button class="settings" onclick="showToast('تنظیمات به زودی اضافه می‌شود')">⚙</button>
</header>

<section class="profile">

  <div class="user">
    <div class="avatar" id="userAvatar">👤</div>

    <div>
      <div class="user-name" id="userName">در حال دریافت اطلاعات...</div>
      <div class="level">Level 1</div>
      <div class="progress"><div></div></div>
    </div>
  </div>

  <div class="coins">
    <span class="coin">🪙</span>
    <span id="coinCount">...</span>
    <button class="plus" onclick="showToast('فروشگاه سکه به زودی فعال می‌شود')">+</button>
  </div>

</section>

<!-- Daily reward -->
<section class="daily-card">

  <div class="daily-top">
    <div class="daily-heading">
      <div class="daily-icon">🎁</div>
      <div>
        <div class="daily-title">جایزه روزانه</div>
        <div class="daily-subtitle">هر روز وارد شو و سکه بگیر!</div>
      </div>
    </div>

    <div class="streak-badge" id="streakBadge">
      🔥 روز ۱
    </div>
  </div>

  <div class="daily-divider"></div>

  <div class="daily-bottom">
    <div>
      <div class="reward-label">جایزه امروز</div>
      <div class="reward-value" id="rewardValue">
        ... <span>سکه</span>
      </div>
    </div>

    <button
      class="claim-button"
      id="claimButton"
      onclick="claimDailyReward()"
      disabled
    >
      در حال بارگذاری...
    </button>
  </div>

  <div class="daily-message" id="dailyMessage">
    در حال دریافت وضعیت جایزه...
  </div>

</section>

<section class="hero">
  <div class="game-icon">🎮</div>
  <div class="logo">GOZAR</div>
  <div class="logo"><span>GAMES</span></div>
  <div class="slogan">بازی کن، سرگرم شو!</div>
</section>

<button class="main-button" onclick="window.location.href='/snake.html'">
  <span class="play-icon">🎮</span>
  <div>
    <div class="main-title">شروع بازی</div>
    <div class="main-sub">وارد دنیای بازی شو</div>
  </div>
  <span>❯</span>
</button>

<section class="menu-grid">

  <button class="menu-card" onclick="showToast('رتبه‌بندی به زودی فعال می‌شود')">
    <span class="card-icon">🏆</span>
    <div>
      <div class="card-title">رتبه‌بندی</div>
      <div class="card-sub">مشاهده برترین‌ها</div>
    </div>
  </button>

  <button class="menu-card" onclick="showToast('فروشگاه به زودی فعال می‌شود')">
    <span class="card-icon">🛒</span>
    <div>
      <div class="card-title">فروشگاه</div>
      <div class="card-sub">خرید آیتم و امکانات</div>
    </div>
  </button>

  <button class="menu-card" onclick="showToast('مأموریت‌ها به زودی فعال می‌شوند')">
    <span class="card-icon">📋</span>
    <div>
      <div class="card-title">ماموریت‌ها</div>
      <div class="card-sub">چالش‌ها و جایزه‌ها</div>
    </div>
  </button>

  <button class="menu-card" onclick="showToast('پشتیبانی به زودی فعال می‌شود')">
    <span class="card-icon">🎧</span>
    <div>
      <div class="card-title">پشتیبانی</div>
      <div class="card-sub">ارتباط با ما</div>
    </div>
  </button>

</section>

<div class="info">✦ به خانواده بزرگ GOZAR GAMES خوش آمدی!</div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="changeTab(this,'خانه')">
    <span class="nav-icon">⌂</span>خانه
  </button>

  <button class="nav-item" onclick="changeTab(this,'آمار')">
    <span class="nav-icon">▥</span>آمار
  </button>

  <button class="nav-item" onclick="changeTab(this,'جوایز')">
    <span class="nav-icon">🎁</span>جوایز
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;

let dailyRewardLoaded = false;
let claimingReward = false;

function showToast(message){
  const toast = document.getElementById('toast');

  toast.textContent = message;
  toast.style.display = 'block';

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2500);
}

function changeTab(button,name){
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.remove('active');
  });

  button.classList.add('active');

  if(name !== 'خانه'){
    showToast(name + ' به زودی فعال می‌شود');
  }
}

function formatCoins(value){
  const number = Number(value);

  if(!Number.isSafeInteger(number) || number < 0){
    return '0';
  }

  return number.toLocaleString('en-US');
}

function setUserInfo(user){
  const nameElement = document.getElementById('userName');
  const avatarElement = document.getElementById('userAvatar');

  const fullName = [user.first_name, user.last_name]
    .filter(Boolean)
    .join(' ');

  nameElement.textContent =
    fullName || user.username || 'بازیکن GOZAR';

  if(user.photo_url){
    const image = document.createElement('img');
    image.src = user.photo_url;
    image.alt = 'Avatar';

    avatarElement.replaceChildren(image);
  }
}

function setDailyReward(data){
  const rewardElement = document.getElementById('rewardValue');
  const streakElement = document.getElementById('streakBadge');
  const button = document.getElementById('claimButton');
  const message = document.getElementById('dailyMessage');

  rewardElement.innerHTML =
    `${formatCoins(data.reward)} <span>سکه</span>`;

  const streak = data.claimed
    ? data.daily_streak
    : data.next_streak;

  streakElement.textContent = `🔥 روز ${streak}`;

  if(data.claimed){
    button.textContent = '✓ دریافت شد';
    button.disabled = true;
    button.classList.add('claimed');
    message.textContent = 'جایزه امروزت رو دریافت کردی؛ فردا دوباره بیا!';
  }else{
    button.textContent = 'دریافت جایزه';
    button.disabled = false;
    button.classList.remove('claimed');
    message.textContent = 'جایزه امروزت منتظرته!';
  }

  dailyRewardLoaded = true;
}

async function loadWallet(){
  const coinElement = document.getElementById('coinCount');
  const userElement = document.getElementById('userName');

  if(!tg || !tg.initData){
    userElement.textContent = 'بازیکن مهمان';
    coinElement.textContent = '—';

    showToast('برای مشاهده کیف پول، از تلگرام وارد شو');
    return;
  }

  tg.ready();
  tg.expand();

  if(tg.initDataUnsafe && tg.initDataUnsafe.user){
    setUserInfo(tg.initDataUnsafe.user);
  }

  try{
    const response = await fetch('/api/wallet', {
      method: 'GET',
      headers: {
        'X-Telegram-Init-Data': tg.initData
      },
      cache: 'no-store'
    });

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.error || 'Wallet request failed');
    }

    const wallet = data.wallet;

    if(!wallet){
      throw new Error('Wallet data missing');
    }

    coinElement.textContent = formatCoins(wallet.coins);

  }catch(error){
    console.error('Wallet error:', error);

    coinElement.textContent = '—';
    showToast('دریافت موجودی ناموفق بود');
  }
}

async function loadDailyReward(){
  const button = document.getElementById('claimButton');
  const message = document.getElementById('dailyMessage');

  if(!tg || !tg.initData){
    button.textContent = 'ورود به تلگرام';
    button.disabled = true;
    message.textContent = 'برای دریافت جایزه وارد ربات تلگرام شو';
    return;
  }

  try{
    const response = await fetch('/api/daily-reward', {
      method: 'GET',
      headers: {
        'X-Telegram-Init-Data': tg.initData
      },
      cache: 'no-store'
    });

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.error || 'Daily reward request failed');
    }

    setDailyReward(data);

  }catch(error){
    console.error('Daily reward GET error:', error);

    button.textContent = 'تلاش دوباره';
    button.disabled = false;
    message.textContent = 'دریافت وضعیت جایزه ناموفق بود';
  }
}

async function claimDailyReward(){
  if(claimingReward || !tg || !tg.initData) return;

  const button = document.getElementById('claimButton');
  const message = document.getElementById('dailyMessage');
  const coinElement = document.getElementById('coinCount');

  claimingReward = true;
  button.disabled = true;
  button.textContent = 'در حال دریافت...';

  try{
    const response = await fetch('/api/daily-reward', {
      method: 'POST',
      headers: {
        'X-Telegram-Init-Data': tg.initData
      },
      cache: 'no-store'
    });

    const data = await response.json();

    if(response.status === 409 && data.already_claimed){
      await loadDailyReward();
      showToast('جایزه امروز قبلاً دریافت شده');
      return;
    }

    if(!response.ok || !data.success){
      throw new Error(data.error || 'Claim failed');
    }

    coinElement.textContent = formatCoins(data.coins);

    setDailyReward({
      claimed: true,
      daily_streak: data.daily_streak,
      next_streak: data.daily_streak,
      reward: data.reward
    });

    message.textContent = 'جایزه با موفقیت به حسابت اضافه شد!';
    showToast(`${formatCoins(data.reward)} سکه دریافت کردی!`);

  }catch(error){
    console.error('Daily reward POST error:', error);

    button.disabled = false;
    button.textContent = 'تلاش دوباره';
    message.textContent = 'دریافت جایزه ناموفق بود؛ دوباره تلاش کن';
    showToast('دریافت جایزه انجام نشد');

  }finally{
    claimingReward = false;
  }
}

if(tg){
  tg.ready();
  tg.expand();
}

loadWallet();
loadDailyReward();
</script>

</body>
</html>
